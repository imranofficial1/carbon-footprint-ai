<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Footprint AI - Calculate Your Digital Impact</title>
    <link rel="stylesheet" href="static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Carbon Footprint AI</h1>
            <p>Calculate and reduce your digital carbon footprint with AI-powered insights</p>
        </header>

        <main>
            <div class="card">
                <form id="footprint-form">
                    <div class="form-group">
                        <label for="device_type">Device Type</label>
                        <select id="device_type" name="device_type" required>
                            <option value="">Select your device</option>
                            <option value="Desktop">Desktop Computer</option>
                            <option value="Laptop">Laptop</option>
                            <option value="Smartphone">Smartphone</option>
                            <option value="Tablet">Tablet</option>
                            <option value="Smart TV">Smart TV</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="data_usage">Daily Data Usage (GB)</label>
                        <input type="number" id="data_usage" name="data_usage" min="0" step="0.1" required>
                    </div>

                    <div class="form-group">
                        <label for="streaming_hours">Daily Streaming Hours</label>
                        <input type="number" id="streaming_hours" name="streaming_hours" min="0" step="0.5" required>
                    </div>

                    <div class="form-group">
                        <label for="energy_source">Energy Source</label>
                        <select id="energy_source" name="energy_source" required>
                            <option value="">Select energy source</option>
                            <option value="Renewable">Renewable Energy</option>
                            <option value="Non-renewable">Non-renewable Energy</option>
                            <option value="Mixed">Mixed Sources</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="region">Region</label>
                        <select id="region" name="region" required>
                            <option value="">Select your region</option>
                            <option value="North America">North America</option>
                            <option value="Europe">Europe</option>
                            <option value="Asia">Asia</option>
                            <option value="South America">South America</option>
                            <option value="Africa">Africa</option>
                            <option value="Oceania">Oceania</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-block">Calculate My Footprint</button>
                </form>
            </div>

            <div id="loading" class="loading">
                <p>Calculating your carbon footprint...</p>
            </div>

            <div id="error-message" class="error-message"></div>

            <div id="results" class="results">
                <h2>Your Digital Carbon Footprint</h2>
                
                <div id="metrics-container" class="metrics-container">
                    <!-- Metrics will be inserted here -->
                </div>

                <h2>Personalized Recommendations</h2>
                <div id="recommendations-container" class="recommendations">
                    <!-- Recommendations will be inserted here -->
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Made with 💚 for a greener digital future</p>
        </footer>
    </div>

    <script src="scripts/app.js"></script>
</body>
</html>
